<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Edit Studio</title><style>body{font:16px Tahoma,sans-serif;background:#0e1420;color:#edf2f8;max-width:780px;margin:auto;padding:24px}h1{color:#f0ba66}section{background:#1d2838;border:1px solid #415066;border-radius:18px;padding:20px;margin:16px 0}input,select,button{padding:12px;border-radius:9px;border:1px solid #59687a;background:#111c2b;color:white;margin:5px}button{background:#dc9347;color:#191819;font-weight:bold;cursor:pointer}label{display:inline-block;margin:10px}input[type=number]{width:65px}small{color:#b5c1cf}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>🎬 Cinema Edit Studio</h1><p>سازنده فایل پروژه برای تدوین سینمایی؛ مستقل و بدون آپلود فایل‌های شخصی.</p><section><h2>تنظیمات</h2><label>عرض <input id="w" type="number" value="1080"></label><label>ارتفاع <input id="h" type="number" value="1920"></label><label>فریم <input id="fps" type="number" value="30"></label><p><label>مسیر موسیقی (اختیاری) <input id="music" placeholder="music.mp3"></label></p></section><section><h2>نماها</h2><div id="shots"></div><button onclick="add()">+ افزودن نما</button></section><button onclick="build()">ساخت فایل پروژه JSON</button><section><small>برای رندر، فایل دانلودشده را کنار ویدئوها قرار داده و در محیط دارای Python و FFmpeg اجرا کنید: python studio.py project.json -o output/reel.mp4</small><pre id="status"></pre></section><script>function add(){let d=document.createElement('div');d.innerHTML='<label>فایل <input class="clip" placeholder="video.mp4"></label><label>شروع <input class="start" type="number" step=".1" value="0"></label><label>مدت <input class="dur" type="number" min=".1" step=".1" value="2"></label><label>سرعت <input class="speed" type="number" min=".1" max="8" step=".1" value="1"></label><button type="button">×</button>';d.querySelector('button').onclick=()=>d.remove();document.getElementById('shots').appendChild(d)}function build(){try{const children=Array.from(document.getElementById('shots').children);const shots=children.map(d=>({file:d.querySelector('.clip').value.trim(),start:Number(d.querySelector('.start').value),duration:Number(d.querySelector('.dur').value),speed:Number(d.querySelector('.speed').value)}));let w=+document.getElementById('w').value,h=+document.getElementById('h').value,fps=+document.getElementById('fps').value;if(!shots.length||shots.some(s=>!s.file||s.start<0||s.duration<=0||s.speed<=0||s.speed>8)||w<=0||h<=0||w%2||h%2||fps<=0)throw Error('اطلاعات نماها یا خروجی معتبر نیست');let m=document.getElementById('music').value.trim();let obj={resolution:[w,h],fps,shots,music:m||null};let b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='project.json';a.click();URL.revokeObjectURL(u);document.getElementById('status').textContent='فایل پروژه ساخته شد؛ رندر در این صفحه انجام نمی‌شود.'}catch(e){document.getElementById('status').textContent=e.message}}add()</script></body></html>
