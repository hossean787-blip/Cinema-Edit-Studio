name: Cinema Studio web editor and distributable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser, FFmpeg, and verified browser test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run real Chromium UI test, click render, and collect screenshots
        run: |
          export CINEMA_PORT=8877
          export CINEMA_WORKSPACE="$RUNNER_TEMP/cinema-private-test"
          sh packaging/launch-host.sh > "$RUNNER_TEMP/cinema-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'cat "$RUNNER_TEMP/cinema-browser-server.log" || true; kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8877/api/projects >/dev/null; then break; fi
            sleep 1
          done
          ffmpeg -v error -y -f lavfi -i testsrc2=size=160x288:rate=24 -t 3.4 -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/browser_video.mp4"
          CINEMA_URL=http://127.0.0.1:8877 CINEMA_TEST_VIDEO="$RUNNER_TEMP/browser_video.mp4" CINEMA_QA_OUT=qa-browser-artifacts node tests/browser_qa_playwright.js
      - name: Save actual visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-browser-visual-qa
          path: |
            qa-browser-artifacts/
            ${{ runner.temp }}/cinema-browser-server.log
          if-no-files-found: ignore
          retention-days: 14
  web-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render engine and pro optional Python adapters for regression
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvidstab1.1
          python -m pip install -r requirements-professional.txt
      - name: Validate UI JavaScript using Node
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html=fs.readFileSync('web/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!script) throw Error('Editor UI script missing');
          fs.writeFileSync('/tmp/cinema-ui.js',script[1]);
          JS
          node --check /tmp/cinema-ui.js
      - name: Real HTTP integration including render, security, persistence, AI auto-mode
        run: python -m unittest discover -s tests -p 'test_web_workspace.py' -v
      - name: Verify Render authentication and public-bind fail-closed behavior
        run: python -m unittest discover -s tests -p 'test_render_auth.py' -v
      - name: Enforce upload and workspace safety quotas
        run: python -m unittest discover -s tests -p 'test_upload_quota.py' -v
      - name: End-to-end three-video music render and persistent recovery
        run: python -m unittest discover -s tests -p 'test_three_video_music_acceptance.py' -v
      - name: Create verified no-vendored-binary release ZIP
        run: |
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          root=Path('.')
          output=Path('Cinema-Edit-Studio-host-bundle.zip')
          excludes={'.git','__pycache__','.venv','workspace','outputs','tmp'}
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
              for file in root.rglob('*'):
                  if not file.is_file() or any(p in excludes for p in file.parts) or file==output:
                      continue
                  if file.suffix.lower() in ('.mov','.mp4','.wav','.mp3','.png','.jpg','.bin','.pth'):
                      continue
                  z.write(file,Path('Cinema-Edit-Studio')/file)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert any(x.endswith('/studio_web.py') for x in z.namelist())
              assert any(x.endswith('/web/index.html') for x in z.namelist())
              print('Files',len(z.namelist()),'SHA256',hashlib.sha256(output.read_bytes()).hexdigest())
          PY
      - name: Verify archive restore and application startup imports
        run: |
          python - <<'PYREST'
          import subprocess, tempfile, zipfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile('Cinema-Edit-Studio-host-bundle.zip') as package:
                  assert package.testzip() is None
                  package.extractall(td)
              root=Path(td)/'Cinema-Edit-Studio'
              assert (root/'studio_web.py').is_file()
              assert (root/'web/index.html').is_file()
              subprocess.run(['python','-m','py_compile',str(root/'studio_web.py'),str(root/'timeline_render.py')],check=True)
              subprocess.run(['python','-c',
                  'from studio_web import Studio; import tempfile; t=tempfile.TemporaryDirectory(); s=Studio(t.name,worker=False); assert len(s.list())==0; s.close()',
                  ],cwd=root,check=True)
          print('Extract-and-import restore test passed')
          PYREST
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-studio-host-bundle
          path: Cinema-Edit-Studio-host-bundle.zip
          retention-days: 14
